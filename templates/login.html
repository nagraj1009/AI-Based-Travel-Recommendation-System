{% extends "base.html" %}

{% block content %}

<div class="container">

    <div class="row justify-content-center mt-5">

        <div class="col-md-5">

            <div class="glass">

                <h2 class="mb-4">
                    Welcome Back
                </h2>

                <form method="POST">

                    <input
                        type="email"
                        name="email"
                        class="form-control mb-3"
                        placeholder="Email"
                        required>

                    <input
                        type="password"
                        name="password"
                        class="form-control mb-3"
                        placeholder="Password"
                        required>

                    <button
                        class="btn btn-primary w-100">

                        Login

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
